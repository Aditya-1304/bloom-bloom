[package]
name = "bloom-bloom"
version = "0.1.0"
edition = "2024"

[dependencies]
rayon = { version = "1.12.0", optional = true }
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"

[features]
default = []
prefetch = []
demo-rayon = ["dep:rayon"]

[[bin]]
name = "bloom-bloom"
path = "src/main.rs"
required-features = ["demo-rayon"]
